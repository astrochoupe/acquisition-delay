name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            jpackage-type: msi
          - os: ubuntu-latest
            jpackage-type: deb
          - os: macos-latest
            jpackage-type: dmg

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and create jlink image
      run: mvn -B package javafx:jlink -Djpackage.skip=true

    - name: Create native installer
      shell: bash
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        jpackage \
          --type ${{ matrix.jpackage-type }} \
          --name "Acquisition Delay" \
          --app-version "$VERSION" \
          --runtime-image target/acquisition-delay \
          --module fr.walliang.astronomy.acquisitiondelay/fr.walliang.astronomy.acquisitiondelay.ui.GuiLauncher \
          --dest target/installer \
          --vendor "Didier Walliang"

    - name: Upload release assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        gh release upload "${{ github.event.release.tag_name }}" target/*.zip
        gh release upload "${{ github.event.release.tag_name }}" target/installer/*.${{ matrix.jpackage-type }}
